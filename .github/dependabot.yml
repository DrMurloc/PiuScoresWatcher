# Dependabot version updates: one pull request a month for everything — NuGet and the workflow
# actions together, patch, minor and major alike. CI on that pull request is the check; a bump
# that breaks the build waits there until it is fixed or dropped.
# Security alerts and fixes are separate and configured in the repository settings, not here.
version: 2

multi-ecosystem-groups:
  monthly:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "monthly"
